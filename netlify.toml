# Netlify deploy config. Vercel reads vercel.json; the two are equivalent.
# The app is a single static page, so there is no SPA rewrite rule to add.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
